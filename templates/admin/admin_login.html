<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa; /* Light gray background */
        }
    </style>
</head>
<body>
    <div class="card shadow" style="width: 25rem;">
        <div class="card-body">
            <h2 class="card-title text-center">Admin Login</h2>
            {% if error %}
                <p class="text-danger text-center">{{ error }}</p>
            {% endif %}
            <form method="post" action="{% url 'store:admin_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" style="background-color: #8b7fac;">Login</button>
                </div>
            </form>

            Forgot Password? <a href="{% url 'store:password-reset' %}" style="color: #8b7fac;">Reset Now?</a>

        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->
</body>
</html>
